        '
  - name: tackle
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted
        '
  - name: tackle_cli
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd apps/tackle_cli
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted
          cargo test --locked --manifest-path native/tackle/Cargo.toml
          cargo fmt --manifest-path native/tackle/Cargo.toml --check
          mix escript.build
        '
