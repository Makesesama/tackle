# This workflow targets Woodpecker's local backend on a Nix host. For local
# backends, `image` names the shell executable rather than a container image.
when:
  - event: [push, pull_request, tag, manual]
steps:
  - name: library
    image: bash
    commands:
      - nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash ./nix/ci-check.sh library
  - name: runtime
    image: bash
    commands:
      - nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash ./nix/ci-check.sh runtime
  - name: provider-plugins
    image: bash
    commands:
      - nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash ./nix/ci-check.sh provider-plugins
  - name: integration-plugins
    image: bash
    commands:
      - nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash ./nix/ci-check.sh integration-plugins
  - name: harness
    image: bash
    commands:
      - nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash ./nix/ci-check.sh harness
  - name: cli
    image: bash
    commands:
      - nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash ./nix/ci-check.sh cli
  - name: web
    image: bash
    commands:
      - nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash ./nix/ci-check.sh web
