# This workflow targets Woodpecker's local backend on a Nix host. For local
# backends, `image` names the shell executable rather than a container image.
when:
  - event: [push, pull_request, tag, manual]
steps:
  - name: tackle_lib
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_lib
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted mix.exs "lib/**/*.{ex,exs}" "test/**/*.{ex,exs}"
        '
  - name: tackle_runtime
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_runtime
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted mix.exs "lib/**/*.{ex,exs}" "test/**/*.{ex,exs}"
        '
  - name: tackle_codex
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_codex
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted mix.exs "lib/**/*.{ex,exs}" "test/**/*.{ex,exs}"
        '
  - name: tackle_deepseek
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_deepseek
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted mix.exs "lib/**/*.{ex,exs}" "test/**/*.{ex,exs}"
        '
  - name: tackle_anubis
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_anubis
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted mix.exs "lib/**/*.{ex,exs}" "test/**/*.{ex,exs}"
        '
  - name: tackle_mcp
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_mcp
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted mix.exs "lib/**/*.{ex,exs}" "test/**/*.{ex,exs}"
        '
  - name: tackle_phoenix
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_phoenix
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted mix.exs "lib/**/*.{ex,exs}" "test/**/*.{ex,exs}"
        '
  - name: tackle_tools
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_tools
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted
        '
  - name: tackle_review
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle_review
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted
        '
  - name: tackle
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd packages/tackle
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted
        '
  - name: tackle_cli
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd apps/tackle_cli
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted
          cargo test --locked --manifest-path native/tackle/Cargo.toml
          cargo fmt --manifest-path native/tackle/Cargo.toml --check
          mix escript.build
        '
  - name: tackle_hub
    image: bash
    commands:
      - |
        nix --extra-experimental-features 'nix-command flakes' develop .#ci --command bash -euc '
          cd apps/tackle_hub
          # A throwaway PostgreSQL cluster on a Unix socket, stopped on exit.
          export TACKLE_HUB_PGHOST=$(mktemp -d)
          trap "bash scripts/db.sh stop" EXIT
          bash scripts/db.sh start
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix test
          mix format --check-formatted
          mix credo --strict
        '
  - name: tackle_hub_package
    image: bash
    commands:
      # Keeps the release building from nix/tackle-hub-deps.nix; regenerate
      # that file with `mix deps.nix` in apps/tackle_hub after dependency changes.
      - nix --extra-experimental-features 'nix-command flakes' build .#tackle-hub --no-link
