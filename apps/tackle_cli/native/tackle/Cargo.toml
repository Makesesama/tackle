[package]
name = "tackle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Same Rust stack as ExRatatui, but no shared resources or ABI.
ratatui = { version = "0.30", default-features = false, features = ["underline-color", "unstable-rendered-line-info"] }
rustler = { version = "0.38", default-features = false, features = ["derive", "nif_version_2_16"] }
# Line matching and intraline emphasis for edit cards. `inline` adds the
# second-level refinement that marks the tokens that actually changed.
similar = { version = "3.2", features = ["inline"] }
# Markdown → ratatui Text for assistant prose, styled by the theme's wire
# stylesheet. The default `highlight-code` feature (syntect, ansi-to-tui) is
# off: CodeFences routes every fenced block to Lumis before prose renders,
# so the crate's own highlighter is unreachable dead weight.
tui-markdown = { version = "0.3", default-features = false }

[build-dependencies]
cc = "1"
